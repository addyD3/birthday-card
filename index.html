<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Suprise</title>

  <style>
    :root {
      --pink: #f2a1b5;
      --coral: #ef927e;
      --cream: #fff5e7;
      --brown: #8f684c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #e9d7c5;
      font-family: Georgia, serif;
      color: var(--brown);
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      width: min(100%, 470px);
      position: relative;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 16px 45px #6d493533;
      background: var(--cream);
      transform: scale(.97);
      transition:
        opacity .65s ease,
        transform .65s ease,
        visibility .65s;
    }

    .scene.active {
      position: relative;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);
    }

    .art {
      display: block;
      width: 100%;
      height: auto;
    }

    /* COVER: the hotspot is positioned over the heart */
    .heart-hotspot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 72%;
      height: 39%;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 48% 48% 8% 8%;
      background: transparent;
    }

    .page-hotspot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    

    .heart-hotspot:focus-visible,
    .action:focus-visible {
      outline: 3px solid #b04479;
      outline-offset: 4px;
    }

    .hint {
      position: absolute;
      bottom: 2%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #fff8ed;
      text-shadow: 0 1px 4px #553622;
      animation: hint 1.6s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes hint {
      to { opacity: .55; }
    }

    /* LETTER */
    .letter-button {
      position: absolute;
      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      border: 1px solid #d48b9b;
      border-radius: 30px;
      color: #814e5b;
      background: #fff6e9ee;
      box-shadow: 0 4px 15px #7c493322;
    }

    
    .action {
      display: block;
      margin: 20px auto 0;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      background: var(--pink);
      color: #633d49;
      box-shadow: 0 4px 10px #7c493322;
    }

    /* FINAL SCENE */
    .final-title {
      position: absolute;
      top: 5%;
      left: 5%;
      right: 5%;
      text-align: center;
      font-size: clamp(23px, 6vw, 34px);
      color: #d97c91;
      text-shadow: 0 1px white;
    }

    .candle {
      position: absolute;
      top: 62%;
      width: 12px;
      height: 48px;
      border-radius: 4px;
      background: repeating-linear-gradient(
        45deg,
        #fff0cf 0 5px,
        #f0a0b5 5px 10px
      );
      box-shadow: 0 2px 4px #69432b22;
    }

    .candle:nth-of-type(2) { left: 40%; }
    .candle:nth-of-type(3) { left: 48%; }
    .candle:nth-of-type(4) { left: 56%; }

    .flame {
      position: absolute;
      top: -20px;
      left: 2px;
      width: 9px;
      height: 16px;
      background: #ffb52e;
      border-radius: 60% 40% 55% 45%;
      box-shadow: 0 0 12px #ffba47;
      transform-origin: center bottom;
      animation: flicker .25s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from { transform: rotate(-7deg) scale(1); }
      to { transform: rotate(7deg) scale(.85, 1.1); }
    }

    .candle.out .flame {
      animation: blowout .35s forwards;
    }

    @keyframes blowout {
      to {
        opacity: 0;
        transform: translate(14px, -22px) scale(.1);
      }
    }

    .final-message {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 5%;
      text-align: center;
      font-size: 18px;
      color: #a44d70;
    }

    .confetti {
      position: absolute;
      top: -20px;
      z-index: 5;
      width: 9px;
      height: 14px;
      background: var(--pink);
      animation: fall 2.8s linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(650px) rotate(650deg);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
    
  </style>
</head>
<body> 
  <h1>Happy Birthday!</h1>
  <p>A little suprise is waiting for you...</p>
  
  <main class="card" id="card">
  <!-- PAGE 1- COVER-->
  <section class="scene active" id="cover">
    <img 
      src="cover.png" 
      alt="Birthday cover"
      class="art"
    >
    
    <button
      class="heart-hotspot"
      id="openCard"
      aria-label="Open the birthday card"
    ></button>
    
    <div class="hint">♡ tap the heart to open ♡</div>
  </section>

  
<!-- PAGE 2 INSIDE-->
<section class="scene" id="inside">
  <img 
    src="inside.png" 
    alt="Inside of birthday card" 
    class="art"
  >
  
  <button
    class="page-hotspot"
    id="openEnvelope"
    aria-label="Continue to the letter"
  ></button>
  
  <div class="hint"> ♡ tap to continue ♡ </div>
    
</section>
  </main>
  
<script>
  // Switch between the card pages
  function showScene(id) {
    document.querySelectorAll(".scene").forEach(scene => {
      scene.classList.toggle("active", scene.id === id);
    });
  }

  // Click the heart to open the card
  document.getElementById("openCard").addEventListener("click", () => {
    showScene("inside");
  });

  // Click the inside page to continue
  document.getElementById("openEnvelope").addEventListener("click", () => {
    alert("Your next page will be the envelope!");
  });
</script>
  
</body>
</html>
