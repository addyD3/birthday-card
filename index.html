<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Suprise</title>

  <style>
    :root {
      --pink: #f2a1b5;
      --coral: #ef927e;
      --cream: #fff5e7
      --brown: #18f684c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #e9d7c5;
      font-family: Georgia, serif;
      color: var(--brown);
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      width: min(100%, 470px);
      position: relative;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 16px 45px #6d493533;
      background: var(--cream);
      transform: scale(.97);
      transition:
        opacity .65s ease,
        transform .65s ease,
        visibility .65s;
    }

    .scene.active {
      position: relative;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);
    }

    .art {
      display: block;
      width: 100%;
      height: auto;
    }

    /* COVER: the hotspot is positioned over the heart */
    .heart-hotspot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 72%;
      height: 39%;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 48% 48% 8% 8%;
      background: transparent;
    }

    .heart-hotspot:focus-visible,
    .action:focus-visible {
      outline: 3px solid #b04479;
      outline-offset: 4px;
    }

    .hint {
      position: absolute;
      bottom: 2%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #fff8ed;
      text-shadow: 0 1px 4px #553622;
      animation: hint 1.6s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes hint {
      to { opacity: .55; }
    }

    /* LETTER */
    .letter-button {
      position: absolute;
      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      border: 1px solid #d48b9b;
      border-radius: 30px;
      color: #814e5b;
      background: #fff6e9ee;
      box-shadow: 0 4px 15px #7c493322;
    }

    .letter-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #63493688;
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s, visibility .45s;
    }

    .letter-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .letter-paper {
      width: 100%;
      max-height: 90%;
      overflow-y: auto;
      padding: 28px 23px;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0 30px,
          #dcb9a455 31px
        ),
        #fff8eb;
      border: 1px solid #e2c4a8;
      box-shadow: 0 12px 35px #38251f55;
      transform: translateY(35px) rotate(-2deg);
      transition: transform .55s cubic-bezier(.2,.8,.2,1);
    }

    .letter-overlay.open .letter-paper {
      transform: translateY(0) rotate(0);
    }

    .letter-paper h2 {
      margin-top: 0;
      text-align: center;
      color: #d87991;
      font-size: clamp(25px, 7vw, 34px);
    }

    .letter-paper p {
      font-size: 16px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .action {
      display: block;
      margin: 20px auto 0;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      background: var(--pink);
      color: #633d49;
      box-shadow: 0 4px 10px #7c493322;
    }

    /* FINAL SCENE */
    .final-title {
      position: absolute;
      top: 5%;
      left: 5%;
      right: 5%;
      text-align: center;
      font-size: clamp(23px, 6vw, 34px);
      color: #d97c91;
      text-shadow: 0 1px white;
    }

    .candle {
      position: absolute;
      top: 62%;
      width: 12px;
      height: 48px;
      border-radius: 4px;
      background: repeating-linear-gradient(
        45deg,
        #fff0cf 0 5px,
        #f0a0b5 5px 10px
      );
      box-shadow: 0 2px 4px #69432b22;
    }

    .candle:nth-of-type(2) { left: 40%; }
    .candle:nth-of-type(3) { left: 48%; }
    .candle:nth-of-type(4) { left: 56%; }

    .flame {
      position: absolute;
      top: -20px;
      left: 2px;
      width: 9px;
      height: 16px;
      background: #ffb52e;
      border-radius: 60% 40% 55% 45%;
      box-shadow: 0 0 12px #ffba47;
      transform-origin: center bottom;
      animation: flicker .25s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from { transform: rotate(-7deg) scale(1); }
      to { transform: rotate(7deg) scale(.85, 1.1); }
    }

    .candle.out .flame {
      animation: blowout .35s forwards;
    }

    @keyframes blowout {
      to {
        opacity: 0;
        transform: translate(14px, -22px) scale(.1);
      }
    }

    .final-message {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 5%;
      text-align: center;
      font-size: 18px;
      color: #a44d70;
    }

    .confetti {
      position: absolute;
      top: -20px;
      z-index: 5;
      width: 9px;
      height: 14px;
      background: var(--pink);
      animation: fall 2.8s linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(650px) rotate(650deg);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
    
  </style>
</head>
<body> 
  <h1>Happy Birthday!</h1>
  <p>A little suprise is waiting for you...</p>
  <section id="card cover">
    <img src="card cover.png" alt="Birthday card cover">
  </section>

  <section id="card inside">
    <img src="card inside.png" alt="Inside of birthday card">
  </section>
</body>
</html>
